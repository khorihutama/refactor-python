[project]
name = "refactor-python"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.ruff.lint]
# Bad config content is always ValueError, so the CLI catches one error type.
ignore = ["TRY004"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
